<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Docker Simulator Test · Praxis Learn</title>
  <link rel="stylesheet" href="./styles/cyberpunk.css?v=46">
  <link rel="stylesheet" href="./styles/layout.css?v=46">
  <style>
    .docker-test-page { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
    .scenario { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-bottom: 24px; }
    .scenario h2 { color: var(--accent); margin-top: 0; }
    .scenario .description { color: var(--text-muted); margin-bottom: 16px; }
    .terminal-mount { margin-bottom: 16px; } }
    .dockerfile-area { display: flex; gap: 12px; }
    .dockerfile-area textarea { flex: 1; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 12px; font-family: var(--font-mono); font-size: 0.85rem; resize: vertical; }
    .dockerfile-area .actions { display: flex; flex-direction: column; gap: 8px; }
    .btn { padding: 6px 14px; border: 1px solid var(--border); border-radius: 4px; background: var(--card-bg); color: var(--text); cursor: pointer; }
    .btn:hover { background: var(--accent); color: #000; }
    .btn-primary { background: var(--accent); color: #000; }
    .btn-primary:hover { filter: brightness(1.1); }
    .btn-ghost { background: transparent; }
    .docker-terminal-container { border: 1px solid var(--border); border-radius: 6px; background: #0a0e14; }
    .docker-terminal { border: 1px solid var(--border); border-radius: 6px; background: #0a0e14; }
    .docker-terminal-output { padding: 12px; font-family: var(--font-mono); font-size: 0.85rem; max-height: 200px; overflow-y: auto; }
    .docker-terminal-output .docker-output-line { color: #e0e0e0; }
    .docker-terminal-output .docker-output-error { color: #ff6b6b; }
    .docker-terminal-input-line { display: flex; align-items: center; border-top: 1px solid var(--border); padding: 8px 12px; }
    .docker-input { flex: 1; background: transparent; color: var(--text); border: none; outline: none; font-family: var(--font-mono); font-size: 0.85rem; }
    .docker-prompt { color: var(--accent); margin-right: 8px; }
    .docker-status-panel { position: sticky; top: 0; background: var(--card-bg); border-bottom: 1px solid var(--border); padding: 10px; font-size: 0.8rem; }
    .docker-status-section { padding: 4px 0; }
    .docker-status-item { padding: 2px 0; color: var(--text-muted); font-size: 0.75rem; }
    .docker-status-title { font-weight: 600; color: var(--accent); margin-bottom: 6px; }
    html { visibility: hidden; }
    html.ready { visibility: visible; }
  </style>
</head>
<body>
  <div class="docker-test-page">
    <h1>Docker Simulator — Тест</h1>

    <div class="scenario">
      <h2>Сценарий 1: Базовый веб-сервер</h2>
      <div class="description">pull nginx, запустить контейнер, проверить статус и логи</div>
      <div class="terminal-mount" id="term1"></div>
    </div>

    <div class="scenario">
      <h2>Сценарий 2: Dockerfile + build</h2>
      <div class="description">Напишите Dockerfile, соберите образ, запустите контейнер</div>
      <div class="dockerfile-area">
        <textarea id="dockerfileInput" rows="10" placeholder="Введите Dockerfile..."></textarea>
        <div class="actions">
          <button class="btn" id="loadExample">Загрузить пример</button>
          <button class="btn btn-primary" id="parseBtn">Парсить Dockerfile</button>
        </div>
      </div>
      <div class="terminal-mount" id="term2"></div>
      <div class="terminal-mount" id="parseResult"></div>
    </div>

    <div class="scenario">
      <h2>Сценарий 3: Очистка</h2>
      <div class="description">Создайте несколько контейнеров, остановите и удалите, затем очистите</div>
      <div class="terminal-mount" id="term3"></div>
    </div>
  </div>

  <script type="module">
    import { createDockerTerminal } from './scripts/docker-terminal.js';
    import { parseDockerfile } from './scripts/dockerfile-parser.js';

    window.addEventListener('load', function() {
      document.documentElement.classList.add('ready');
    });

    const scenario1 = createDockerTerminal(document.getElementById('term1'));
    const scenario2 = createDockerTerminal(document.getElementById('term2'));
    const scenario3 = createDockerTerminal(document.getElementById('term3'));

    window.scenarios = { scenario1, scenario2, scenario3 };

    document.getElementById('loadExample').addEventListener('click', () => {
      document.getElementById('dockerfileInput').value = [
        'FROM python:3.12-slim',
        'WORKDIR /app',
        'COPY requirements.txt .',
        'RUN pip install --no-cache-dir -r requirements.txt',
        'COPY . .',
        'EXPOSE 5000',
        'CMD ["python", "app.py"]'
      ].join('\n');
    });

    document.getElementById('parseBtn').addEventListener('click', () => {
      const text = document.getElementById('dockerfileInput').value;
      const result = parseDockerfile(text);
      let html = '<div class="docker-status-title">Результат парсинга</div>';
      html += '<div class="docker-status-section">Слои: ' + result.layers + '</div>';
      html += '<div class="docker-status-section">Base image: ' + (result.baseImage || 'не указан') + '</div>';
      if (result.errors.length) {
        html += '<div class="docker-status-section" style="color:var(--red);">Ошибки: ' + result.errors.join(', ') + '</div>';
      }
      if (result.warnings.length) {
        html += '<div class="docker-status-section" style="color:var(--accent);">Предупреждения: ' + result.warnings.join(', ') + '</div>';
      }
      html += '<div class="docker-status-section">Инструкции: ' + result.instructions.map(i => i.instruction).join(', ') + '</div>';
      document.getElementById('parseResult').innerHTML = html;
    });
  </script>
</body>
</html>
