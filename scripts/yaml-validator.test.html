<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YAML Validator Test · Praxis Learn</title>
  <link rel="stylesheet" href="./styles/cyberpunk.css?v=51">
  <link rel="stylesheet" href="./styles/layout.css?v=51">
  <script src="./vendor/js-yaml.min.js?v=51"></script>
  <style>
    html { visibility: hidden; }
    html.ready { visibility: visible; }
    .yaml-test-page { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
    .test-scenario { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-bottom: 24px; }
    .test-scenario h2 { color: var(--cyan); margin-top: 0; }
    .test-result { font-family: var(--font-mono); font-size: 0.85rem; margin-top: 12px; padding: 12px; background: var(--bg); border-radius: 4px; }
    .test-result.pass { border-left: 2px solid var(--green); }
    .test-result.fail { border-left: 2px solid var(--red); }
    .result-line { margin: 2px 0; }
    .result-line.ok { color: var(--green); }
    .result-line.err { color: var(--red); }
  </style>
</head>
<body>
  <div class="yaml-test-page">
    <h1>YAML Validator — Тест</h1>

    <div class="test-scenario">
      <h2>Тест 1: Валидный compose (2 сервиса)</h2>
      <div id="test1" class="test-result"></div>
    </div>

    <div class="test-scenario">
      <h2>Тест 2: Compose без services → ошибка</h2>
      <div id="test2" class="test-result"></div>
    </div>

    <div class="test-scenario">
      <h2>Тест 3: depends_on на несуществующий сервис → ошибка</h2>
      <div id="test3" class="test-result"></div>
    </div>

    <div class="test-scenario">
      <h2>Тест 4: Валидный K8s Deployment</h2>
      <div id="test4" class="test-result"></div>
    </div>

    <div class="test-scenario">
      <h2>Тест 5: K8s без metadata.name → ошибка</h2>
      <div id="test5" class="test-result"></div>
    </div>

    <div class="test-scenario">
      <h2>Тест 6: GitHub Actions workflow</h2>
      <div id="test6" class="test-result"></div>
    </div>

    <div class="test-scenario">
      <h2>Итоги</h2>
      <div id="summary" class="test-result"></div>
    </div>
  </div>

  <script type="module">
    import { parseYaml, validateCompose, validateK8sManifest, validateGithubActions } from './scripts/yaml-validator.js?v=51';

    function showResult(id, passed, lines) {
      const el = document.getElementById(id);
      const cls = passed ? 'pass' : 'fail';
      el.className = 'test-result ' + cls;
      el.innerHTML = lines.map(l => '<div class="result-line ' + (l.ok ? 'ok' : 'err') + '">' + l.text + '</div>').join('');
    }

    const tests = [];
    let passCount = 0;
    let failCount = 0;

    function runTest(name, testFn) {
      try {
        const result = testFn();
        tests.push({ name, result });
        if (result.passed) passCount++;
        else failCount++;
        showResult(result.elementId, result.passed, result.lines);
      } catch (e) {
        tests.push({ name, result: { passed: false, elementId: 'summary', lines: [{ text: 'Ошибка: ' + e.message, ok: false }] } });
        failCount++;
      }
    }

    window.addEventListener('load', () => {
      document.documentElement.classList.add('ready');

      // Test 1: Valid compose
      const composeYaml = `
services:
  web:
    image: nginx:alpine
    ports:
      - "8080:80"
  db:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: secret
`;
      runTest('Test 1', () => {
        const { data, error } = parseYaml(composeYaml);
        if (error) return { elementId: 'test1', passed: false, lines: [{ text: 'Parse error: ' + error, ok: false }] };
        const v = validateCompose(data);
        return {
          elementId: 'test1',
          passed: v.valid,
          lines: [
            { text: 'valid: ' + v.valid, ok: v.valid },
            { text: 'errors: ' + (v.errors.length ? v.errors.join(', ') : 'нет'), ok: !v.errors.length },
            { text: 'services: ' + v.services.join(', '), ok: v.services.length === 2 },
          ],
        };
      });

      // Test 2: Compose without services
      runTest('Test 2', () => {
        const { data, error } = parseYaml('version: "3"\n');
        const v = validateCompose(data);
        return {
          elementId: 'test2',
          passed: !v.valid,
          lines: [
            { text: 'valid: ' + v.valid, ok: !v.valid },
            { text: 'errors: ' + v.errors.join(', '), ok: !v.valid },
          ],
        };
      });

      // Test 3: depends_on на несуществующий
      const badCompose = `
services:
  web:
    image: nginx:alpine
    depends_on:
      - nonexistent
`;
      runTest('Test 3', () => {
        const { data, error } = parseYaml(badCompose);
        const v = validateCompose(data);
        const hasError = v.errors.some(e => e.includes('nonexistent'));
        return {
          elementId: 'test3',
          passed: !v.valid && hasError,
          lines: [
            { text: 'valid: ' + v.valid, ok: !v.valid },
            { text: 'errors: ' + v.errors.join(', '), ok: hasError },
          ],
        };
      });

      // Test 4: Valid K8s Deployment
      const k8sYaml = `
apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app
spec:
  replicas: 3
  template:
    spec:
      containers:
        - name: app
          image: myapp:latest
`;
      runTest('Test 4', () => {
        const { data, error } = parseYaml(k8sYaml);
        const v = validateK8sManifest(data);
        return {
          elementId: 'test4',
          passed: v.valid,
          lines: [
            { text: 'valid: ' + v.valid, ok: v.valid },
            { text: 'kind: ' + v.kind, ok: v.kind === 'Deployment' },
            { text: 'name: ' + v.name, ok: v.name === 'my-app' },
          ],
        };
      });

      // Test 5: K8s без metadata.name
      const k8sBad = `
apiVersion: apps/v1
kind: Deployment
metadata: {}
spec:
  replicas: 1
  template: {}
`;
      runTest('Test 5', () => {
        const { data, error } = parseYaml(k8sBad);
        const v = validateK8sManifest(data);
        return {
          elementId: 'test5',
          passed: !v.valid,
          lines: [
            { text: 'valid: ' + v.valid, ok: !v.valid },
            { text: 'errors: ' + v.errors.join(', '), ok: !v.valid },
          ],
        };
      });

      // Test 6: GitHub Actions
      const ghActions = `
name: CI
on: push
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install
      - run: npm test
`;
      runTest('Test 6', () => {
        const { data, error } = parseYaml(ghActions);
        const v = validateGithubActions(data);
        return {
          elementId: 'test6',
          passed: v.valid,
          lines: [
            { text: 'valid: ' + v.valid, ok: v.valid },
            { text: 'jobs: ' + v.jobs.join(', '), ok: v.jobs.length === 1 },
          ],
        };
      });

      // Summary
      document.getElementById('summary').className = 'test-result ' + (failCount === 0 ? 'pass' : 'fail');
      document.getElementById('summary').innerHTML =
        '<div class="result-line ok">Всего тестов: ' + (passCount + failCount) + '</div>' +
        '<div class="result-line ok">Пройдено: ' + passCount + '</div>' +
        '<div class="result-line ' + (failCount === 0 ? 'ok' : 'err') + '">Провалено: ' + failCount + '</div>';
    });
  </script>
</body>
</html>
