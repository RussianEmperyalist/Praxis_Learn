<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Git Simulator Test · Praxis Learn</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="./styles/cyberpunk.css?v=50">
  <link rel="stylesheet" href="./styles/layout.css?v=50">
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <header class="app-header">
    <button class="menu-toggle" id="menuToggle" aria-label="Меню" aria-expanded="false">☰</button>
    <a href="./index.html" class="logo" aria-label="Praxis Learn — главная">
      <span class="logo-text">PRAXIS LEARN</span>
    </a>
    <nav>
      <a href="./index.html">Курсы</a>
    </nav>
    <span class="spacer"></span>
    <div class="user-menu">
      <a href="./login.html" class="btn btn-primary btn-sm">Вход</a>
    </div>
  </header>

  <div class="layout">
    <main class="content wide">
      <h1 class="hero-title">Git симулятор — тестовая страница</h1>

      <div class="card" style="margin-bottom:24px;padding:20px;">
        <h2 style="margin:0 0 12px;font-size:1.1rem;">Сценарии</h2>
        <div style="display:flex;gap:12px;flex-wrap:wrap;">
          <button class="btn btn-ghost" onclick="runScenarioBranch()">Сценарий: ветвление</button>
          <button class="btn btn-ghost" onclick="runScenarioConflict()">Сценарий: конфликт</button>
          <button class="btn btn-ghost" onclick="runScenarioReset()">Сценарий: откат</button>
        </div>
      </div>

      <div id="gitTerminal"></div>

      <div class="card" style="margin-top:24px;padding:20px;">
        <h2 style="margin:0 0 12px;font-size:1.1rem;">Состояние симулятора</h2>
        <pre id="gitState" style="font-family:var(--font-mono);font-size:0.75rem;color:var(--text-muted);white-space:pre-wrap;word-break:break-word;"></pre>
      </div>
    </main>
  </div>

    <script type="module">
    import { createGitTerminal } from './scripts/git-terminal.js';

    const mount = document.getElementById('gitTerminal');
    const stateEl = document.getElementById('gitState');
    const terminal = createGitTerminal(mount);

    function updateState() {
      const s = terminal.getState();
      stateEl.textContent = JSON.stringify(s, null, 2);
    }

    terminal.sim.state.config['user.name'] = 'student';
    terminal.setOpts({});

    function setFile(path, content) {
      terminal.sim.state.working[path] = content;
    }

    function runCommands(commands) {
      commands.forEach(cmd => {
        const result = terminal.execute(cmd);
        updateState();
      });
    }

    window.runScenarioBranch = function() {
      terminal.reset();
      terminal.sim.state.config['user.name'] = 'student';
      setFile('README.md', '# Project\n');
      terminal.execute('git init');
      terminal.execute('git add README.md');
      terminal.execute('git commit -m "initial commit"');
      terminal.execute('git branch feature');
      terminal.execute('git checkout feature');
      setFile('file.txt', 'feature content');
      terminal.execute('git add file.txt');
      terminal.execute('git commit -m "feature work"');
      terminal.execute('git checkout main');
      terminal.execute('git merge feature');
      updateState();
    };

    window.runScenarioConflict = function() {
      terminal.reset();
      terminal.sim.state.config['user.name'] = 'student';
      setFile('conf.txt', 'line1');
      terminal.execute('git init');
      terminal.execute('git add conf.txt');
      terminal.execute('git commit -m "initial"');
      terminal.execute('git branch test');
      terminal.execute('git checkout test');
      setFile('conf.txt', 'line1\ntest change');
      terminal.execute('git add conf.txt');
      terminal.execute('git commit -m "test change"');
      terminal.execute('git checkout main');
      setFile('conf.txt', 'line1\nmain change');
      terminal.execute('git add conf.txt');
      terminal.execute('git commit -m "main change"');
      terminal.execute('git merge test');
      updateState();
    };

    window.runScenarioReset = function() {
      terminal.reset();
      terminal.sim.state.config['user.name'] = 'student';
      setFile('file1.txt', 'content1');
      terminal.execute('git init');
      terminal.execute('git add file1.txt');
      terminal.execute('git commit -m "commit 1"');
      setFile('file2.txt', 'content2');
      terminal.execute('git add file2.txt');
      terminal.execute('git commit -m "commit 2"');
      terminal.execute('git reset --soft HEAD~1');
      updateState();
    };

    // Watch state changes after each execute
    const origExecute = terminal.execute;
    terminal.execute = function(cmd) {
      const result = origExecute(cmd);
      updateState();
      return result;
    };

    updateState();
    </script>
</body>
</html>
