<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Урок · Praxis Learn</title>
  <link rel="stylesheet" href="./styles/cyberpunk.css">
  <link rel="stylesheet" href="./styles/layout.css">
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <!-- Подсветка синтаксиса -->
  <script src="./js/highlighter.js" defer></script>
  <!-- Pyodide: исполнение Python прямо в браузере -->
  <script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
</head>
<body>
  <header class="app-header"></header>

  <div class="layout lesson-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="content" id="lessonContent">
      <div class="card"><span class="spinner"></span> Загрузка урока...</div>
    </main>
    <aside class="toc" id="toc">
      <div class="toc-title">// Содержание</div>
    </aside>
  </div>

  <div id="toasts"></div>

  <script type="module">
    import { renderHeader, getQuery, toast } from './scripts/app.js';
    import { content } from './scripts/content.js';
    import { auth } from './scripts/auth.js';
    import { progress } from './scripts/progress.js';
    import { createPlayground } from './scripts/editor.js';

    renderHeader('home');

    (async () => {
      const courseId = getQuery('course');
      const lessonId = getQuery('lesson');
      if (!courseId || !lessonId) { location.href = './index.html'; return; }

      const user = await auth.current();
      const idx = await content.getLessonsIndex(courseId);
      const course = await content.getCourse(courseId);
      const lesson = await content.getLesson(courseId, lessonId);

      document.title = `${lesson.title} · Praxis Learn`;

      // Сайдбар
      const allProgress = user ? await progress.getAll(user.id) : [];
      const map = new Map(allProgress.map(p => [p.lessonId, p]));
      document.getElementById('sidebar').innerHTML = `
        <div class="sidebar-section">// ${course.title}</div>
        ${idx.lessons.map((l, i) => {
          const p = map.get(l.id);
          const cls = l.id === lessonId ? 'active' : (p?.status === 'completed' ? 'done' : '');
          return `<a href="./lesson.html?course=${courseId}&lesson=${l.id}" class="${cls}">
            <span class="num">${String(i+1).padStart(2,'0')}</span> ${l.title}
          </a>`;
        }).join('')}
        <div class="sidebar-section">// Навигация</div>
        <a href="./course.html?id=${courseId}">← К программе курса</a>
      `;

      // Контент урока
      const main = document.getElementById('lessonContent');
      main.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
          <span class="badge">${course.title}</span>
          <span class="mono" style="color:var(--text-mute); font-size:.78rem;">
            ${lesson.id}
          </span>
        </div>
        <h1 style="margin-top:4px;">${lesson.title}</h1>
        ${lesson.goal ? `<p class="goal" style="color:var(--text-dim); font-size:1.05rem; margin-top:16px;">${lesson.goal}</p>` : ''}
        <div id="theory"></div>
        <div id="tasks"></div>
        ${lesson.recap ? '<div id="recap"></div>' : ''}
        <div id="quizSection"></div>
        <div class="lesson-nav">
          <button class="btn btn-ghost" id="prevBtn">← Предыдущий</button>
          <button class="btn btn-primary" id="completeBtn">Отметить как пройденный ✓</button>
          <button class="btn btn-ghost" id="nextBtn">Следующий →</button>
        </div>
      `;

      // Рендер теории
      const theory = document.getElementById('theory');
      theory.innerHTML = (lesson.theory || []).map(block => renderTheoryBlock(block)).join('');

      // Подсветка синтаксиса
      if (window.PraxisHighlighter) PraxisHighlighter.highlightAll();

      // TOC из заголовков
      const toc = document.getElementById('toc');
      const headings = lesson.theory?.filter(b => b.type === 'heading') || [];
      let tocHtml = '';
      if (headings.length) {
        tocHtml = '<div class="toc-title">// Содержание</div>' + headings.map(h => {
          const slug = h.content.toLowerCase().replace(/[^а-яёa-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
          return `<a href="#${slug}" data-slug="${slug}">${h.content}</a>`;
        }).join('');
      }

      // Точки наблюдения для подсветки активного раздела
      const tocLinks = {};

      // Карточка прогресса (в правой колонке под TOC)
      const totalTasks = lesson.tasks?.length || 0;
      const totalQuiz = lesson.quiz?.length || 0;
      let completedTasks = 0;
      let completedQuiz = 0;
      toc.innerHTML = tocHtml + `
        <div class="lesson-progress-card">
          <div class="stat-row"><span>Задач решено:</span> <b id="tasksProgress">0 / ${totalTasks}</b></div>
          <div class="stat-row"><span>Квизов:</span> <b id="quizProgress">0 / ${totalQuiz}</b></div>
          <div class="progress"><div id="overallProgress" style="width:0%"></div></div>
        </div>
      `;

      const progressEl = document.getElementById('overallProgress');
      const tasksLabel = document.getElementById('tasksProgress');
      const quizLabel = document.getElementById('quizProgress');

      function updateProgress() {
        const total = totalTasks + totalQuiz;
        const done = completedTasks + completedQuiz;
        const pct = total ? Math.round((done / total) * 100) : 0;
        tasksLabel.textContent = `${completedTasks} / ${totalTasks}`;
        quizLabel.textContent = `${completedQuiz} / ${totalQuiz}`;
        if (progressEl) progressEl.style.width = pct + '%';
      }

      // IntersectionObserver для подсветки активного пункта TOC
      const headingEls = document.querySelectorAll('h2[id]');
      headingEls.forEach(h => {
        tocLinks[h.id] = toc.querySelector(`a[data-slug="${h.id}"]`);
      });
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          const link = tocLinks[entry.target.id];
          if (!link) return;
          if (entry.isIntersecting) {
            link.classList.add('active');
          } else {
            link.classList.remove('active');
          }
        });
      }, { threshold: 0.5, rootMargin: '-80px 0px -80px 0px' });
      headingEls.forEach(h => observer.observe(h));

      // Рендер recap
      if (lesson.recap && lesson.recap.length) {
        const recap = document.getElementById('recap');
        recap.innerHTML = '<h2>// Ключевые мысли</h2>' + lesson.recap.map(p => `<div class="recap-item">• ${p}</div>`).join('');
      }

      // Задачи
      const tasks = document.getElementById('tasks');
      (lesson.tasks || []).forEach((task, i) => {
        const wrap = document.createElement('div');
        wrap.style.marginTop = '32px';
        wrap.innerHTML = `
           <div style="display:flex; gap:12px; align-items:center; margin-bottom:12px;">
             <span class="badge active">Задача ${i + 1}</span>
             <span style="font-family:var(--font-display); font-size:1.05rem;">${task.prompt}</span>
           </div>
           <div class="playground-hints" id="hints-${task.id}">
             ${task.hints.map((h, hi) => `<div class="hint">💡 ${h}</div>`).join('')}
           </div>
         `;
        const mount = document.createElement('div');
        wrap.appendChild(mount);
        tasks.appendChild(wrap);

          createPlayground(mount, {
            starter: task.starter || '',
            checks: task.checks || [],
            tests: task.tests || [],
            userId: user?.id,
            taskId: task.id,
            currentLessonId: lesson.id,
            onPass: () => {
              toast('Задача решена ✓', 'success');
              completedTasks++;
              updateProgress();
              markLessonProgress();
            }
          });
      });

      // Квиз
      if (lesson.quiz?.length) {
        const qs = document.getElementById('quizSection');
        qs.innerHTML = '<h2 style="margin-top:40px;">// Проверка</h2>';
        lesson.quiz.forEach((q, qi) => {
          const block = document.createElement('div');
          block.className = 'card';
          block.style.marginBottom = '16px';
          block.innerHTML = `
            <div style="font-family:var(--font-display); font-size:1.05rem; margin-bottom:12px;">
              ${qi + 1}. ${q.q}
            </div>
            <div class="quiz-options"></div>
          `;
          const opts = block.querySelector('.quiz-options');
          q.options.forEach((opt, oi) => {
            const el = document.createElement('div');
            el.className = 'quiz-option';
            el.textContent = `${String.fromCharCode(65 + oi)}. ${opt}`;
            el.addEventListener('click', async () => {
              if (el.dataset.done) return;
              opts.querySelectorAll('.quiz-option').forEach(o => o.dataset.done = '1');
              const correct = oi === q.answer;
              el.classList.add(correct ? 'correct' : 'wrong');
              if (!correct) opts.children[q.answer].classList.add('correct');
              if (q.explain) {
                const expl = document.createElement('div');
                expl.className = 'quiz-explanation';
                expl.innerHTML = `<strong>↔ Объяснение:</strong> ${escapeHtml(q.explain)}`;
                block.appendChild(expl);
              }
              if (correct) completedQuiz++;
              updateProgress();
              if (user) {
                await progress.setQuizResult(user.id, lesson.id, `${lesson.id}-q${qi}`, correct);
                markLessonProgress();
              }
            });
            opts.appendChild(el);
          });
          qs.appendChild(block);
        });
      }

      // Навигация prev/next
      const idxPos = idx.lessons.findIndex(l => l.id === lessonId);
      const prev = idx.lessons[idxPos - 1];
      const next = idx.lessons[idxPos + 1];
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');
      if (prev) prevBtn.onclick = () => location.href = `./lesson.html?course=${courseId}&lesson=${prev.id}`;
      else prevBtn.disabled = true;
      if (next) nextBtn.onclick = () => location.href = `./lesson.html?course=${courseId}&lesson=${next.id}`;
      else nextBtn.disabled = true;

      // Отметка о прохождении
      const completeBtn = document.getElementById('completeBtn');
      if (user) {
        const p = map.get(lesson.id);
        if (p?.status === 'completed') completeBtn.textContent = '✓ Пройдено';
        completeBtn.onclick = async () => {
          await progress.completeLesson(user.id, lesson.id);
          toast('Урок отмечен как пройденный', 'success');
          completeBtn.textContent = '✓ Пройдено';
        };
      } else {
        completeBtn.onclick = () => location.href = './login.html';
        completeBtn.textContent = 'Войдите, чтобы сохранять прогресс';
      }

      // Пометить как начатый
      if (user) markLessonProgress();

      async function markLessonProgress() {
        await progress.markStarted(user.id, lesson.id);
      }

      function renderTheoryBlock(b) {
        if (b.type === 'hook') return `<div class="hero-question"><strong>◆</strong> ${b.content}</div>`;
        if (b.type === 'text') return `<p>${b.content}</p>`;
        if (b.type === 'html') return b.content;
        if (b.type === 'code') {
          const lang = b.lang || 'python';
          return `<pre class="language-${lang}"><code class="language-${lang}">${escapeHtml(b.content)}</code></pre>`;
        }
        if (b.type === 'note') return `<div class="note"><strong>◆ NOTE.</strong> ${b.content}</div>`;
        if (b.type === 'warning') return `<div class="warning"><strong>⚠ ВНИМАНИЕ.</strong> ${b.content}</div>`;
        if (b.type === 'tip') return `<div class="tip"><strong>★ СОВЕТ.</strong> ${b.content}</div>`;
        if (b.type === 'heading') {
          const slug = b.content.toLowerCase().replace(/[^а-яёa-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
          return `<h2 id="${slug}">${b.content}</h2>`;
        }
        if (b.type === 'predict') return renderPredictBlock(b);
        return '';
      }

      function renderPredictBlock(b) {
        return `
          <div class="predict-block">
            <pre class="language-python"><code class="language-python">${escapeHtml(b.code)}</code></pre>
            <div class="predict-question">${b.question}</div>
            <div class="predict-options" data-answer="${b.answer}">
              ${b.options.map((opt, oi) => `
                <div class="predict-option" data-idx="${oi}">
                  ${String.fromCharCode(65 + oi)}. ${opt}
                </div>
              `).join('')}
            </div>
            <div class="predict-explain" style="display:none;">
              <strong>↔ Объяснение:</strong> ${b.explain}
            </div>
          </div>
        `;
      }

      document.querySelectorAll('.predict-options').forEach(container => {
        const correctIdx = parseInt(container.dataset.answer);
        container.addEventListener('click', function(e) {
          const opt = e.target.closest('.predict-option');
          if (!opt || opt.dataset.done === '1') return;
          const all = container.querySelectorAll('.predict-option');
          all.forEach(o => { o.dataset.done = '1'; });
          const isCorrect = parseInt(opt.dataset.idx) === correctIdx;
          opt.classList.add(isCorrect ? 'correct' : 'wrong');
          if (!isCorrect) all[correctIdx].classList.add('correct');
          const expl = container.nextElementSibling;
          if (expl) expl.style.display = 'block';
        });
      });

      function escapeHtml(s) {
        return String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
      }
    })();
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./service-worker.js');
    }
  </script>
</body>
</html>
