<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Praxis Learn — Изучай код как нетраннер</title>
  <meta name="theme-color" content="#0a0e14">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles/cyberpunk.css">
  <link rel="stylesheet" href="./styles/layout.css">
  <script src="./js/highlighter.js" defer></script>
</head>
<body>
  <header class="app-header"></header>

  <section class="hero">
    <h1 class="hero-title">> SYSTEM ONLINE</h1>
    <p class="subtitle">Платформа для изучения Python, Git и DevOps до уровня Junior+</p>
    <div class="cta">
      <a href="#courses" class="btn btn-primary">Начать обучение</a>
      <a href="./login.html" class="btn btn-ghost">Войти</a>
    </div>
  </section>

  <h2 class="section-title">// Доступные модули</h2>
  <div class="cards-grid" id="coursesGrid">
    <div class="card"><span class="spinner"></span> Загрузка...</div>
  </div>

  <footer class="footer">
    <p>PRAXIS LEARN v0.1 · данные хранятся локально в <code>data/db.json</code></p>
  </footer>

  <div id="toasts"></div>

  <script type="module">
    import { renderHeader, toast } from './scripts/app.js';
    import { content } from './scripts/content.js';

    renderHeader('home');

    (async () => {
      try {
        const courses = await content.getCourses();
        const grid = document.getElementById('coursesGrid');
        grid.innerHTML = courses.map(c => `
          <a class="card course-card" href="./course.html?id=${c.id}">
            <div class="icon">${c.icon}</div>
            <h3>${c.title}</h3>
            <p>${c.description}</p>
            <div class="meta">
              <span>${c.lessons} уроков</span>
              <span class="badge">${c.level}</span>
            </div>
          </a>
        `).join('');
      } catch (e) {
        toast('Не удалось загрузить курсы: ' + e.message, 'error');
      }
    })();
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./service-worker.js');
    }
  </script>
</body>
</html>
